<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日早报 · 导航首页</title>
<style>
  :root{
    --bg:#f7f7f7; --card:#ffffff; --ink:#1a1a1a; --sub:#555; --line:#e6e6e6;
    --accent:#0b5cad; --strong:#111;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.75; font-size:16px;}
  .wrap{max-width:820px; margin:0 auto; padding:16px 14px 48px;}
  header.hero{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 18px; margin-bottom:18px;}
  header.hero h1{font-size:24px; font-weight:800; letter-spacing:.5px;}
  header.hero .date{color:var(--sub); font-size:14px; margin-top:4px;}
  .meta{margin-top:12px; background:#eef5fb; border-radius:10px; padding:12px 14px; font-size:14px; color:#234;}
  .meta b{color:#111; font-weight:700;}
  section{margin-top:26px;}
  h2.sec{font-size:19px; font-weight:800; padding-left:10px; border-left:4px solid var(--accent); margin-bottom:12px;}
  a.card{display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 16px; margin-bottom:14px; text-decoration:none; color:inherit;
    transition:border-color .15s, transform .15s;}
  a.card:hover{border-color:var(--accent); transform:translateY(-2px);}
  a.card h3{font-size:17px; font-weight:750; color:var(--strong);}
  a.card p{font-size:14px; color:var(--sub); margin-top:4px;}
  .arrow{float:right; color:var(--accent); font-weight:800;}
  footer{margin-top:28px; font-size:12.5px; color:#888; text-align:center; line-height:1.8;}
  @media (max-width:480px){
    body{font-size:15.5px;}
    header.hero h1{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="hero">
  <h1>📰 每日早报</h1>
  <div class="date">导航首页 · 各版块入口</div>
  <div class="meta">
    本站聚合 <b>科技早报</b> 与 <b>汽车早报</b> 两个版块，点击下方卡片进入。每次更新后最新日期以版块页内标注为准。
  </div>
</header>

<section>
  <h2 class="sec">版块列表</h2>

  <a class="card" href="tech/">
    <h3>📡 科技早报 <span class="arrow">→</span></h3>
    <p>模型与 Agent · 芯片算力与基础设施 · 前沿研究 · 行业动态</p>
  </a>

  <a class="card" href="auto/">
    <h3>🚗 汽车早报 <span class="arrow">→</span></h3>
    <p>中国车型与发布会 · 自动驾驶与智能化 · 电池与供应链 · 海外市场</p>
  </a>
</section>

<footer>
  由 GitHub Pages 自动部署 · 内容每日更新
</footer>

</div>
</body>
</html>
